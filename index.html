```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bazar Carmelito</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            padding: 40px;
        }

        .contenedor {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            color: #444;
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo-completo {
            grid-column: 1 / 3;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #555;
        }

        .botones {
            grid-column: 1 / 3;
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .registrar {
            background-color: #333;
            color: white;
        }

        .limpiar {
            background-color: #ddd;
            color: #333;
        }

        button:hover {
            opacity: 0.8;
        }

    </style>
</head>


<body>

    <div class="contenedor">

        <h1>Bazar Carmelito</h1>

        <p class="subtitulo">
            Sistema de Gestión de Ventas e Inventario
        </p>


        <form class="formulario">

            <!-- INFORMACIÓN DEL PRODUCTO -->

            <div class="campo-completo">
                <h2>Información del Producto</h2>
            </div>


            <div class="campo">

                <label for="id_producto">
                    ID del Producto
                </label>

                <input
                    type="text"
                    id="id_producto"
                    name="id_producto"
                    maxlength="10"
                    placeholder="Ej: PROD001"
                    required>

            </div>


            <div class="campo">

                <label for="codigo">
                    Código
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    maxlength="50"
                    placeholder="Ej: COD001"
                    required>

            </div>


            <div class="campo">

                <label for="codigo_barras">
                    Código de Barras
                </label>

                <input
                    type="text"
                    id="codigo_barras"
                    name="codigo_barras"
                    maxlength="50"
                    placeholder="Código de barras">

            </div>


            <div class="campo">

                <label for="nombre">
                    Nombre del Producto
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="150"
                    placeholder="Nombre del producto"
                    required>

            </div>


            <div class="campo-completo">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    placeholder="Descripción del producto">
                </textarea>

            </div>


            <!-- CLASIFICACIÓN -->

            <div class="campo-completo">
                <h2>Clasificación</h2>
            </div>


            <div class="campo">

                <label for="id_categoria">
                    ID Categoría
                </label>

                <input
                    type="text"
                    id="id_categoria"
                    name="id_categoria"
                    maxlength="10"
                    placeholder="Ej: CAT001"
                    required>

            </div>


            <div class="campo">

                <label for="id_presentacion">
                    ID Presentación
                </label>

                <input
                    type="text"
                    id="id_presentacion"
                    name="id_presentacion"
                    maxlength="10"
                    placeholder="Ej: PRE001"
                    required>

            </div>


            <div class="campo">

                <label for="id_marca">
                    ID Marca
                </label>

                <input
                    type="text"
                    id="id_marca"
                    name="id_marca"
                    maxlength="10"
                    placeholder="Ej: MAR001">

            </div>


            <div class="campo">

                <label for="estado">
                    Estado
                </label>

                <select id="estado" name="estado">

                    <option value="1">
                        Activo
                    </option>

                    <option value="0">
                        Inactivo
                    </option>

                </select>

            </div>


            <!-- FECHAS -->

            <div class="campo-completo">
                <h2>Registro</h2>
            </div>


            <div class="campo">

                <label for="fecha_registro">
                    Fecha de Registro
                </label>

                <input
                    type="datetime-local"
                    id="fecha_registro"
                    name="fecha_registro">

            </div>


            <div class="campo">

                <label for="fecha_actualizacion">
                    Fecha de Actualización
                </label>

                <input
                    type="datetime-local"
                    id="fecha_actualizacion"
                    name="fecha_actualizacion">

            </div>


            <!-- INVENTARIO -->

            <div class="campo-completo">
                <h2>Inventario</h2>
            </div>


            <div class="campo">

                <label for="stock_actual">
                    Stock Actual
                </label>

                <input
                    type="number"
                    id="stock_actual"
                    name="stock_actual"
                    min="0"
                    step="0.01"
                    value="0">

            </div>


            <div class="campo">

                <label for="stock_minimo">
                    Stock Mínimo
                </label>

                <input
                    type="number"
                    id="stock_minimo"
                    name="stock_minimo"
                    min="0"
                    step="0.01"
                    value="0">

            </div>


            <div class="campo">

                <label for="stock_maximo">
                    Stock Máximo
                </label>

                <input
                    type="number"
                    id="stock_maximo"
                    name="stock_maximo"
                    min="0"
                    step="0.01">

            </div>


            <!-- BOTONES -->

            <div class="botones">

                <button
                    type="submit"
                    class="registrar">
                    Registrar Producto
                </button>

                <button
                    type="reset"
                    class="limpiar">
                    Limpiar
                </button>

            </div>

        </form>

    </div>

</body>

</html>
```
